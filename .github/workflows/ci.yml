name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate -w @repo/db

      # Run all three in sequence — turbo handles intra-task caching so
      # repeated invocations across PRs are cheap.
      - name: Typecheck
        run: npx turbo typecheck

      - name: Test
        run: npx turbo test

      - name: Build
        run: npx turbo build
