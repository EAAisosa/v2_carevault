services:
  - type: web
    name: carevault-api
    runtime: node
    rootDir: apps/api
    buildCommand: cd ../.. && npm ci && npm run build -w @repo/db && npm run build -w @repo/fhir && npm run build -w @repo/api
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: onboarding@resend.dev
